[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rework-docx"
version = "0.2.0"
description = "Write in Markdown, deliver in your client's Word template: pandoc plus the house style it misses."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Dinosung"}]
requires-python = ">=3.10"
keywords = ["pandoc", "docx", "word", "markdown", "template", "reference-doc", "house-style"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["lxml"]

[project.optional-dependencies]
test = ["pytest", "python-docx"]

[project.scripts]
rework = "rework.cli:main"

[project.urls]
Homepage = "https://github.com/Dinosung/rework"
Issues = "https://github.com/Dinosung/rework/issues"
Changelog = "https://github.com/Dinosung/rework/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.setuptools]
packages = ["rework"]
